name: Build B41M HEN STORE PKG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  OPENORBIS_TOOLCHAIN: /opt/openorbis/toolchain.cmake

jobs:
  build-toolchain:
    name: Build/Cache OpenOrbis Toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      toolchain-path: ${{ steps.toolchain.outputs.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache OpenOrbis Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/openorbis
          key: openorbis-toolchain-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: |
            openorbis-toolchain-${{ runner.os }}-

      - name: Check if Toolchain Cached
        id: toolchain
        run: |
          if [ -f "/opt/openorbis/toolchain.cmake" ]; then
            echo "path=/opt/openorbis/toolchain.cmake" >> $GITHUB_OUTPUT
            echo "Toolchain found in cache"
          else
            echo "path=" >> $GITHUB_OUTPUT
            echo "Toolchain not cached, will build"
          fi

      - name: Install Build Dependencies
        if: steps.toolchain.outputs.path == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git curl wget \
            libgmp-dev libmpfr-dev libmpc-dev \
            texinfo bison flex \
            libncurses5-dev libssl-dev \
            python3 python3-pip \
            pkg-config

      - name: Build OpenOrbis Toolchain
        if: steps.toolchain.outputs.path == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use authenticated clone to avoid rate limits
          git clone --recursive --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/OpenOrbis/OpenOrbis.git /tmp/OpenOrbis
          cd /tmp/OpenOrbis
          # Build with limited parallelism to avoid OOM
          ./build-toolchain.sh 2>&1 | tail -50
          echo "OPENORBIS_TOOLCHAIN=/opt/openorbis/toolchain.cmake" >> $GITHUB_ENV

      - name: Verify Toolchain
        run: |
          if [ -f "/opt/openorbis/toolchain.cmake" ]; then
            echo "✅ Toolchain ready at /opt/openorbis/toolchain.cmake"
            ls -la /opt/openorbis/bin/ | head -20
          else
            echo "❌ Toolchain not found"
            exit 1
          fi

  build-orbis-pub-gen:
    name: Build orbis-pub-gen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make git pkg-config libssl-dev

      - name: Cache orbis-pub-gen
        id: cache-pubgen
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/orbis-pub-gen
          key: orbis-pub-gen-${{ runner.os }}
          restore-keys: |
            orbis-pub-gen-${{ runner.os }}-

      - name: Check if Cached
        id: check-pubgen
        run: |
          if [ -f "/usr/local/bin/orbis-pub-gen" ]; then
            echo "cached=true" >> $GITHUB_OUTPUT
            echo "orbis-pub-gen found in cache"
          else
            echo "cached=false" >> $GITHUB_OUTPUT
          fi

      - name: Build orbis-pub-gen
        if: steps.check-pubgen.outputs.cached == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/OpenOrbis/orbis-pub-gen.git /tmp/orbis-pub-gen
          cd /tmp/orbis-pub-gen
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo cp orbis-pub-gen /usr/local/bin/
          orbis-pub-gen --version

      - name: Verify orbis-pub-gen
        run: |
          which orbis-pub-gen
          orbis-pub-gen --version || orbis-pub-gen --help

  build-native:
    name: Build Native App & PKG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-toolchain, build-orbis-pub-gen]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake make git curl \
            libcurl4-openssl-dev \
            libmbedtls-dev libmbedx509-dev libmbedcrypto-dev \
            python3 pkg-config \
            inkscape imagemagick

      - name: Setup Toolchain Environment
        run: |
          echo "OPENORBIS_TOOLCHAIN=/opt/openorbis/toolchain.cmake" >> $GITHUB_ENV
          export OPENORBIS_TOOLCHAIN=/opt/openorbis/toolchain.cmake

      - name: Verify Toolchain
        run: |
          if [ ! -f "$OPENORBIS_TOOLCHAIN" ]; then
            echo "❌ Toolchain not found at $OPENORBIS_TOOLCHAIN"
            find /opt -name "toolchain.cmake" 2>/dev/null || true
            exit 1
          fi
          echo "✅ Toolchain found"

      - name: Convert SVG Assets to PNG
        run: |
          cd native
          chmod +x convert_assets.sh
          ./convert_assets.sh
          echo "Checking generated PNGs:"
          ls -la assets/*.png
          file assets/icon.png assets/background.png

      - name: Build Native Application
        run: |
          cd native
          chmod +x build.sh
          # Run build with error capture
          ./build.sh 2>&1 | tee build.log
          echo "Build exit code: ${PIPESTATUS[0]}"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed, showing last 100 lines:"
            tail -100 build.log
            exit 1
          fi

      - name: Verify Build Output
        run: |
          echo "Checking build directory:"
          ls -la native/build/
          if [ -f "native/build/eboot.bin" ]; then
            echo "✅ eboot.bin found ($(stat -c%s native/build/eboot.bin) bytes)"
          else
            echo "❌ eboot.bin NOT found"
            exit 1
          fi

      - name: Verify PKG Created
        id: pkg-check
        run: |
          if [ -f "native/build/B41M_HEN_STORE.pkg" ]; then
            echo "✅ PKG found"
            PKG_SIZE=$(stat -c%s native/build/B41M_HEN_STORE.pkg)
            echo "Size: $PKG_SIZE bytes ($(numfmt --to=iec $PKG_SIZE))"
            echo "pkg-exists=true" >> $GITHUB_OUTPUT
            echo "pkg-path=native/build/B41M_HEN_STORE.pkg" >> $GITHUB_OUTPUT
          else
            echo "⚠️ PKG not found, checking for fake PKG..."
            if [ -f "native/build/B41M_HEN_STORE_Fake.pkg" ]; then
              echo "✅ Fake PKG found"
              PKG_SIZE=$(stat -c%s native/build/B41M_HEN_STORE_Fake.pkg)
              echo "pkg-exists=true" >> $GITHUB_OUTPUT
              echo "pkg-path=native/build/B41M_HEN_STORE_Fake.pkg" >> $GITHUB_OUTPUT
            else
              echo "pkg-exists=false" >> $GITHUB_OUTPUT
              echo "No PKG found"
              ls -la native/build/
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B41M_HEN_STORE-Build-${{ github.ref_name }}
          path: |
            native/build/eboot.bin
            native/build/*.pkg
            native/build/build.log
          retention-days: 30

      - name: Create Release with PKG
        uses: softprops/action-gh-release@v1
        if: steps.pkg-check.outputs.pkg-exists == 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.pkg-check.outputs.pkg-path }}
          name: B41M HEN STORE ${{ github.ref_name }}
          body: |
            ## B41M HEN STORE ${{ github.ref_name }}
            
            PS4 Homebrew Store - Download and install homebrew applications directly on PS4.
            
            ### Installation
            1. Download `B41M_HEN_STORE.pkg`
            2. Host on web server or copy to USB
            3. Open in PS4 Browser or use GoldHEN Package Installer
            4. Install and launch from dashboard
            
            ### Requirements
            - PS4 with GoldHEN (FW 9.00-11.00+)
            - Internet connection
            
            ### Features
            - Browse homebrew games, apps, tools, emulators
            - Download directly to PS4 notifications via GoldHEN
            - SHA256 verification
            - Auto-update catalog
            - Favorites & Download history
            
            ### Source
            Built from: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (No PKG - Build Failed)
        uses: softprops/action-gh-release@v1
        if: steps.pkg-check.outputs.pkg-exists == 'false' && startsWith(github.ref, 'refs/tags/')
        with:
          name: B41M HEN STORE ${{ github.ref_name }} (Build Failed)
          body: |
            ## ⚠️ Build Failed - No PKG Generated
            
            The PKG build failed. Please check the workflow logs for details.
            
            ### Artifacts Available
            Download the build artifacts from the workflow run to inspect:
            - `eboot.bin` (if compiled)
            - `build.log` (compilation logs)
            
            ### Common Issues
            - OpenOrbis toolchain compilation timeout
            - Missing dependencies (mbedtls, curl)
            - CMake configuration errors
            
            Built from: ${{ github.sha }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    name: Deploy Web Store
    runs-on: ubuntu-latest
    needs: build-native
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: store
          keep_files: true