name: Build B41M HEN STORE PKG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-pkg:
    name: Build PS4 PKG
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake make git curl \
            libcurl4-openssl-dev \
            libmbedtls-dev libmbedx509-dev libmbedcrypto-dev \
            python3 pkg-config \
            inkscape imagemagick
      
      - name: Setup OpenOrbis toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build OpenOrbis toolchain
        run: |
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis.git /tmp/OpenOrbis
          cd /tmp/OpenOrbis
          ./build-toolchain.sh
          echo "OPENORBIS_TOOLCHAIN=/opt/openorbis/toolchain.cmake" >> $GITHUB_ENV
      
      - name: Build orbis-pub-gen
        run: |
          git clone https://github.com/OpenOrbis/orbis-pub-gen.git /tmp/orbis-pub-gen
          cd /tmp/orbis-pub-gen
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo cp orbis-pub-gen /usr/local/bin/
      
      - name: Convert SVG assets to PNG
        run: |
          cd native
          chmod +x convert_assets.sh
          ./convert_assets.sh
      
      - name: Build native application
        run: |
          cd native
          chmod +x build.sh
          ./build.sh
      
      - name: Verify PKG created
        run: |
          if [ -f native/build/B41M_HEN_STORE.pkg ]; then
            echo "PKG found!"
            ls -la native/build/B41M_HEN_STORE.pkg
          else
            echo "PKG not found, checking for eboot.bin..."
            ls -la native/build/
            exit 1
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: native/build/B41M_HEN_STORE.pkg
          name: B41M HEN STORE ${{ github.ref_name }}
          body: |
            ## B41M HEN STORE ${{ github.ref_name }}
            
            PS4 Homebrew Store - Download and install homebrew applications directly on PS4.
            
            ### Installation
            1. Download `B41M_HEN_STORE.pkg`
            2. Host on web server or copy to USB
            3. Open in PS4 Browser or use GoldHEN Package Installer
            4. Install and launch from dashboard
            
            ### Requirements
            - PS4 with GoldHEN (FW 9.00-11.00+)
            - Internet connection
            
            ### Features
            - Browse homebrew games, apps, tools, emulators
            - Download directly to PS4 notifications via GoldHEN
            - SHA256 verification
            - Auto-update catalog
            - Favorites & Download history
            
            ### Source
            Built from: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload PKG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: B41M_HEN_STORE-PKG
          path: native/build/B41M_HEN_STORE.pkg
          retention-days: 30

  build-web:
    name: Deploy Web Store
    runs-on: ubuntu-latest
    needs: build-pkg
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./store
          destination_dir: store